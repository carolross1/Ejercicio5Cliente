name: CI/CD Frontend - Java 21, JaCoCo, Semgrep SAST & SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-jacoco:
    name: Build, Tests Surefire & Cobertura JaCoCo (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar OpenJDK 21 LTS (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar y ejecutar pruebas unitarias (Surefire + JaCoCo)
        run: mvn -B clean test -Dtest=GestorControllerP2CarolTest,ModelosClienteTest,Ejercicio5ClienteApplicationTest

      - name: Empaquetar artefacto JAR
        run: mvn -B package -DskipTests

      - name: Análisis de Calidad en SonarCloud (si SONAR_TOKEN está configurado)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
              -Dsonar.projectKey=carolross1_Ejercicio5Cliente \
              -Dsonar.organization=carolross1 \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.exclusions="**/target/**,**/static/**,**/templates/**" \
              -Dsonar.coverage.exclusions="**/*Application.java,**/config/**,**/modelo/**" \
              -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          else
            echo "SONAR_TOKEN no configurado aún; omitiendo envío a SonarCloud."
          fi

      - name: Publicar Reporte JaCoCo y JAR como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: frontend-jacoco-y-jar
          path: |
            target/site/jacoco/**
            target/*.jar

  semgrep-sast:
    name: Seguridad Estática SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Escaneo SAST con Semgrep (excluyendo target)
        run: |
          semgrep scan --config auto --exclude '**/target/**' --exclude 'target' --json -o semgrep-sast-frontend.json || true
          cat semgrep-sast-frontend.json | head -n 40

      - name: Publicar Reporte SAST Semgrep
        uses: actions/upload-artifact@v4
        with:
          name: frontend-semgrep-sast
          path: semgrep-sast-frontend.json
