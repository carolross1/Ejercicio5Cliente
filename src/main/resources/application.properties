spring.application.name=Ejercicio5Cliente
server.port=9080

# URL del Backend REST (permite sobreescritura dinámica en la nube con API_BACKEND_URL)
api.backend.url=${API_BACKEND_URL:http://localhost:8081}

# Spring Boot Actuator y Monitoreo Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
